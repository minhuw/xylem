[package]
name = "xylem-cli"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
authors = ["xylem contributors"]
description = "CLI interface for Xylem latency measurement tool"
license = "MIT"
repository = "https://github.com/minhuw/xylem"

[lib]
name = "xylem_cli"
path = "src/lib.rs"

[[bin]]
name = "xylem"
path = "src/main.rs"

[[example]]
name = "redis_basic"
path = "examples/redis_basic.rs"

[[example]]
name = "sketch_precision_comparison"
path = "examples/sketch_precision_comparison.rs"

[lints]
workspace = true

[dependencies]
xylem-core = { path = "../xylem-core", features = ["schema"] }
xylem-protocols = { path = "../xylem-protocols", features = ["schema"] }
xylem-common = { path = "../xylem-common" }
xylem-transport = { path = "../xylem-transport" }

clap = { workspace = true }
clap_complete = "4.5"
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
humantime-serde.workspace = true
toml.workspace = true

# Optional evalsync integration for coordinated benchmarking
evalsync = { version = "0.2", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
ntcp-native = { git = "https://github.com/minhuw/ntcp", rev = "34725777c8d8a8393a9a79e86cb714fa2f3f2113", optional = true }
ntcp-io = { git = "https://github.com/minhuw/ntcp", rev = "34725777c8d8a8393a9a79e86cb714fa2f3f2113", optional = true }
ntcp-io-dpdk = { git = "https://github.com/minhuw/ntcp", rev = "34725777c8d8a8393a9a79e86cb714fa2f3f2113", optional = true }

[features]
evalsync = ["dep:evalsync"]
# User-space TCP transport "ntcp" (Linux only)
ntcp = ["xylem-transport/ntcp"]
# ntcp over DPDK ports (Linux only; needs the DPDK SDK of the nix dev shell)
ntcp-dpdk = ["ntcp", "xylem-transport/ntcp-dpdk", "dep:ntcp-native", "dep:ntcp-io", "dep:ntcp-io-dpdk"]
# ntcp over AF_XDP sockets (Linux only; needs the nix dev shell's libbpf and
# BPF clang)
ntcp-af-xdp = ["ntcp", "xylem-transport/ntcp-af-xdp"]

[dev-dependencies]
tempfile = { workspace = true }
