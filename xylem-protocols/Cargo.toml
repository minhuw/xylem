[package]
name = "xylem-protocols"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
authors = ["xylem contributors"]
description = "Protocol implementations for Xylem latency measurement tool"
license = "MIT"
repository = "https://github.com/minhuw/xylem"

[lints]
workspace = true

[features]
schema = ["schemars"]

[dependencies]
xylem-common = { path = "../xylem-common" }
xylem-core = { path = "../xylem-core" }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true, optional = true }
httparse = { workspace = true }
rand = { workspace = true }
rand_distr = { workspace = true }
rmp = "0.8.14"
csv = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
