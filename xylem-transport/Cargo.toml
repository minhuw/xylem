[package]
name = "xylem-transport"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Transport layer implementations for Xylem latency measurement tool"

[dependencies]
# Networking
socket2 = { workspace = true }
libc = { workspace = true }

# Linux-only: I/O multiplexing via nix (epoll)
[target.'cfg(target_os = "linux")'.dependencies]
nix = { workspace = true }
# User-space TCP (the `ntcp` feature), pinned to one ntcp commit
ntcp-native = { git = "https://github.com/minhuw/ntcp", rev = "0a391f8f0b6046eb6a084b6ab7a2f16db6fa8b4c", optional = true }
ntcp-io = { git = "https://github.com/minhuw/ntcp", rev = "0a391f8f0b6046eb6a084b6ab7a2f16db6fa8b4c", optional = true }
ntcp-io-tun = { git = "https://github.com/minhuw/ntcp", rev = "0a391f8f0b6046eb6a084b6ab7a2f16db6fa8b4c", optional = true }

# Non-Linux: I/O multiplexing via mio (kqueue on macOS/BSD, IOCP on Windows)
[target.'cfg(not(target_os = "linux"))'.dependencies]
mio = { workspace = true }

[features]
# User-space TCP transport over ntcp (Linux only; a no-op elsewhere)
ntcp = ["dep:ntcp-native", "dep:ntcp-io", "dep:ntcp-io-tun"]

[dependencies.tracing]
workspace = true

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
