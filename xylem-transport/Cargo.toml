[package]
name = "xylem-transport"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Transport layer implementations for Xylem latency measurement tool"

[dependencies]
# Networking
socket2 = { workspace = true }
libc = { workspace = true }

# Linux-only: I/O multiplexing via nix (epoll)
[target.'cfg(target_os = "linux")'.dependencies]
nix = { workspace = true }
# User-space TCP (the `ntcp` and `ntcp-dpdk` features), pinned to one ntcp
# commit; flake.nix pins the same commit as the `ntcp` input
ntcp-native = { git = "https://github.com/minhuw/ntcp", rev = "f1e28976470f1f93f2c1d280c77f8439b30421ac", optional = true }
ntcp-io = { git = "https://github.com/minhuw/ntcp", rev = "f1e28976470f1f93f2c1d280c77f8439b30421ac", optional = true }
ntcp-io-tun = { git = "https://github.com/minhuw/ntcp", rev = "f1e28976470f1f93f2c1d280c77f8439b30421ac", optional = true }
# NIC clock calibration (pure Rust) and, with its `static` feature, DPDK ports
# linked statically against the DPDK SDK (pkg-config libdpdk, from the
# flake's dev shell)
ntcp-io-dpdk = { git = "https://github.com/minhuw/ntcp", rev = "f1e28976470f1f93f2c1d280c77f8439b30421ac", optional = true }
# AF_XDP sockets with an XDP steering program (the `host` feature: libbpf
# and a BPF clang, from the flake's dev shell)
ntcp-io-af-xdp = { git = "https://github.com/minhuw/ntcp", rev = "f1e28976470f1f93f2c1d280c77f8439b30421ac", optional = true }

# Non-Linux: I/O multiplexing via mio (kqueue on macOS/BSD, IOCP on Windows)
[target.'cfg(not(target_os = "linux"))'.dependencies]
mio = { workspace = true }

[features]
# User-space TCP transport over ntcp (Linux only; a no-op elsewhere)
ntcp = ["dep:ntcp-native", "dep:ntcp-io", "dep:ntcp-io-tun", "dep:ntcp-io-dpdk"]
# The ntcp transport over DPDK ports (Linux only; needs the DPDK SDK)
ntcp-dpdk = ["ntcp", "ntcp-io-dpdk/static"]
# The ntcp transport over AF_XDP sockets (Linux only; needs libbpf and a BPF
# clang)
ntcp-af-xdp = ["ntcp", "dep:ntcp-io-af-xdp", "ntcp-io-af-xdp/host"]

[dependencies.tracing]
workspace = true

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
