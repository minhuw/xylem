[package]
name = "xylem-transport"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Transport layer implementations for Xylem latency measurement tool"

[dependencies]
# Networking
socket2 = { workspace = true }
libc = { workspace = true }

# Linux-only: I/O multiplexing via nix (epoll)
[target.'cfg(target_os = "linux")'.dependencies]
nix = { workspace = true }
# User-space TCP (the `ntcp` feature). The file:// URL is a temporary local
# pin, to be replaced by the GitHub rev once ntcp pushes it.
ntcp-native = { git = "file:///home/minhu/projects/ntcp", rev = "1df55bc6d5f5cd2363ba752a8af63cd906b6037c", optional = true }
ntcp-io = { git = "file:///home/minhu/projects/ntcp", rev = "1df55bc6d5f5cd2363ba752a8af63cd906b6037c", optional = true }
ntcp-io-tun = { git = "file:///home/minhu/projects/ntcp", rev = "1df55bc6d5f5cd2363ba752a8af63cd906b6037c", optional = true }

# Non-Linux: I/O multiplexing via mio (kqueue on macOS/BSD, IOCP on Windows)
[target.'cfg(not(target_os = "linux"))'.dependencies]
mio = { workspace = true }

[features]
# User-space TCP transport over ntcp (Linux only; a no-op elsewhere)
ntcp = ["dep:ntcp-native", "dep:ntcp-io", "dep:ntcp-io-tun"]

[dependencies.tracing]
workspace = true

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
