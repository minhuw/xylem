services:
  nginx:
    image: nginx:alpine
    container_name: xylem-test-nginx
    # Docker picks a free host port; the test guard reads it back with
    # `docker compose port nginx 80`
    ports:
      - "127.0.0.1::80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./delay.js:/etc/nginx/njs/delay.js:ro
