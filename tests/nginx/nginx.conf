events {
    worker_connections 1024;
}

http {
    access_log /dev/stdout;
    error_log /dev/stderr;

    # The default of 1000 closes each benchmark connection after 1000
    # requests, and xylem does not reconnect
    keepalive_requests 100000000;

    server {
        listen 80;

        location / {
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }
    }
}
