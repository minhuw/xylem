# njs answers /delay after a timer
load_module modules/ngx_http_js_module.so;

events {
    worker_connections 1024;
}

http {
    access_log /dev/stdout;
    error_log /dev/stderr;

    # The default of 1000 closes each benchmark connection after 1000
    # requests, and xylem does not reconnect
    keepalive_requests 100000000;

    js_path /etc/nginx/njs/;
    js_import delay from delay.js;

    server {
        listen 80;

        location / {
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        # A 200 sent 1 ms after the request arrives
        location = /delay {
            js_content delay.respond;
        }

        # SSI drops Content-Length, so nginx frames this keep-alive HTTP/1.1
        # response with chunked encoding; the include sends it as three chunks
        location = /chunked {
            ssi on;
            ssi_types text/plain;
            default_type text/plain;
            return 200 "chunked <!--# include virtual=\"/\" --> response\n";
        }
    }
}
