# Cleartext HTTP/2 (h2c with prior knowledge) on TCP and a Unix socket
events {
    worker_connections 1024;
}

http {
    access_log off;
    error_log /dev/stderr;

    # The default of 1000 sends GOAWAY after 1000 streams, and xylem does
    # not reconnect
    keepalive_requests 100000000;

    server {
        listen 80;
        listen unix:/sock/nginx.sock;
        http2 on;

        location / {
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        location = /missing {
            return 404;
        }

        # 300 KB, many DATA frames: receive windows must be given back
        location = /big {
            alias /srv/big.bin;
        }
    }
}
