services:
  nginx:
    image: nginx:alpine
    # The Unix socket must be connectable from the host, and /big holds
    # 300 KB
    command:
      - sh
      - -c
      - head -c 300000 /dev/zero > /srv/big.bin && umask 000 && exec nginx -g 'daemon off;'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      # The test's directory for the Unix socket
      - ${XYLEM_SOCKET_DIR:?}:/sock
