# Knot DNS serving the zones of Stackbench's knot benchmark
# (benchmarks/knot/tests/fixtures), with a few large TXT records that do not
# fit an unextended UDP response.
server:
  rundir: "/rundir"
  listen: [ 0.0.0.0@53 ]

database:
  storage: "/storage"

log:
  - target: stdout
    any: warning

template:
  - id: default
    # The zone files are mounted read-only: load them whole, never write back
    zonefile-sync: -1
    zonefile-load: whole
    journal-content: none

zone:
  - domain: example.test
    file: "/config/example.test.zone"
  - domain: other.invalid
    file: "/config/other.invalid.zone"
