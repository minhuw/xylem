services:
  clickhouse:
    # The version Stackbench's clickhouse benchmark builds
    image: clickhouse/clickhouse-server:26.8.29.10
    environment:
      CLICKHOUSE_DB: bench
      CLICKHOUSE_USER: xylem
      CLICKHOUSE_PASSWORD: xylem-test
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    # No published port: tests connect to the container's address
